[pytest]
minversion = 7.0
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=.
    --cov-report=html
    --cov-report=term-missing

testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for individual functions
    integration: Integration tests
    slow: Slow running tests
